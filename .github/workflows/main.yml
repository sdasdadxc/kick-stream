name: Stream to Kick 24/7

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Tools
      run: |
        sudo apt-get update
        sudo apt-get install ffmpeg -y
        pip install yt-dlp

    - name: Run Live Stream
      run: python stream.py
